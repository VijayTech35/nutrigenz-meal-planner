services:
  - type: web
    name: nutrigenz-meal-planner
    runtime: node
    repo: https://github.com/VijayTech35/nutrigenz-meal-planner
    branch: main
    rootDir: .
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
